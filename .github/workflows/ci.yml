name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: root
            manifest: Cargo.toml
          - workspace: phase8
            manifest: phase8/Cargo.toml
          - workspace: phase9
            manifest: phase9/Cargo.toml
          - workspace: phase10
            manifest: phase10/Cargo.toml
          - workspace: phase11
            manifest: phase11/Cargo.toml
          - workspace: phase12
            manifest: phase12/Cargo.toml
          - workspace: phase13
            manifest: prospective/phase-13-holdout-v4/Cargo.toml
          - workspace: phase14
            manifest: phase14/Cargo.toml
          - workspace: phase15
            manifest: phase15/Cargo.toml
          - workspace: phase16
            manifest: phase16/Cargo.toml
          - workspace: phase17
            manifest: phase17/Cargo.toml
          - workspace: phase18
            manifest: phase18/Cargo.toml
          - workspace: phase19
            manifest: phase19/Cargo.toml
          - workspace: phase20
            manifest: phase20/Cargo.toml
          - workspace: phase21
            manifest: phase21/Cargo.toml
          - workspace: phase22
            manifest: phase22/Cargo.toml
          - workspace: phase23
            manifest: phase23/Cargo.toml
          - workspace: phase24
            manifest: phase24/Cargo.toml
          - workspace: phase25
            manifest: phase25/Cargo.toml
          - workspace: phase26
            manifest: phase26/Cargo.toml
          - workspace: phase27-parser
            manifest: phase27/syntax-parser/Cargo.toml
          - workspace: phase27-1
            manifest: phase27-1/Cargo.toml
          - workspace: phase27-2
            manifest: phase27-2/Cargo.toml
          - workspace: phase27-3
            manifest: phase27-3/Cargo.toml
          - workspace: phase28
            manifest: phase28/Cargo.toml
          - workspace: phase29
            manifest: phase28/Cargo.toml
          - workspace: phase30
            manifest: phase30/Cargo.toml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install repository signature trust root
        run: cp .github/allowed_signers "$(git rev-parse --git-common-dir)/allowed_signers"
      - name: Select immutable historical projection
        if: matrix.workspace == 'phase12' || matrix.workspace == 'phase13' || matrix.workspace == 'phase14'
        run: rm -rf diagnostics/phase-15
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo fmt --manifest-path "${{ matrix.manifest }}" --all --check
      - run: cargo clippy --manifest-path "${{ matrix.manifest }}" --workspace --all-targets --all-features -- -D warnings
      - if: matrix.workspace != 'phase25' && matrix.workspace != 'phase30'
        run: cargo test --manifest-path "${{ matrix.manifest }}" --workspace --all-features
      - name: Test Phase 25 without its local-common-dir fixture
        if: matrix.workspace == 'phase25'
        run: cargo test --manifest-path phase25/Cargo.toml --workspace --all-features -- --skip normal_repository_uses_common_dir_allowed_signers
      - name: Test Phase 30 without its external RC schema fixture
        if: matrix.workspace == 'phase30'
        run: cargo test --manifest-path phase30/Cargo.toml --workspace --all-features -- --skip frozen_schema_rejects_malformed_raw
      - name: Recompute Phase 20 evidence from raw reports
        if: matrix.workspace == 'phase20'
        run: cargo run --offline --manifest-path phase20/Cargo.toml --bin independent-verify -- .
      - name: Verify Phase 21 synthetic qualification evidence
        if: matrix.workspace == 'phase21'
        run: cargo run --offline --manifest-path phase21/Cargo.toml --bin independent-verify -- .
      - name: Verify Phase 26 successor certification
        if: matrix.workspace == 'phase26'
        run: |
          python3 phase26/reproducer/independent_verify.py verify .
          python3 -m unittest phase26/reproducer/test_independent_verify.py
      - name: Verify Phase 29 post-open recovery evidence
        if: matrix.workspace == 'phase29'
        run: python3 phase29/harness.py verify
      - name: Verify Phase 30 exit-status certification
        if: matrix.workspace == 'phase30'
        run: sha256sum --check phase30/SHA256SUMS
      - run: cargo audit --file "$(dirname '${{ matrix.manifest }}')/Cargo.lock" --deny warnings
      - run: cargo deny --manifest-path "${{ matrix.manifest }}" check
