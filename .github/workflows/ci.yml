name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: root
            manifest: Cargo.toml
          - workspace: phase8
            manifest: phase8/Cargo.toml
          - workspace: phase9
            manifest: phase9/Cargo.toml
          - workspace: phase10
            manifest: phase10/Cargo.toml
          - workspace: phase11
            manifest: phase11/Cargo.toml
          - workspace: phase12
            manifest: phase12/Cargo.toml
          - workspace: phase13
            manifest: prospective/phase-13-holdout-v4/Cargo.toml
          - workspace: phase14
            manifest: phase14/Cargo.toml
          - workspace: phase15
            manifest: phase15/Cargo.toml
          - workspace: phase16
            manifest: phase16/Cargo.toml
          - workspace: phase17
            manifest: phase17/Cargo.toml
          - workspace: phase18
            manifest: phase18/Cargo.toml
          - workspace: phase19
            manifest: phase19/Cargo.toml
    steps:
      - uses: actions/checkout@v5
      - name: Select immutable historical projection
        if: matrix.workspace == 'phase12' || matrix.workspace == 'phase13' || matrix.workspace == 'phase14'
        run: rm -rf diagnostics/phase-15
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo fmt --manifest-path "${{ matrix.manifest }}" --all --check
      - run: cargo clippy --manifest-path "${{ matrix.manifest }}" --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path "${{ matrix.manifest }}" --workspace --all-features
      - run: cargo audit --file "$(dirname '${{ matrix.manifest }}')/Cargo.lock" --deny warnings
      - run: cargo deny --manifest-path "${{ matrix.manifest }}" check
