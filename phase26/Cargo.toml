[workspace]

[package]
name = "secure-bench-phase26"
description = "Serialization conformance checks for the Phase 26 independent certification"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/usesecure/secure-bench"

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
