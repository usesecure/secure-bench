[workspace]

[package]
name = "secure-bench-phase28-native-adapter"
description = "Scanner-free native adapter helper for the Secure Bench Phase 28 one-shot campaign"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/usesecure/secure-bench"
publish = false

[dependencies]
secure-bench-core = { path = "../crates/secure-bench-core", version = "=0.1.0" }
secure-bench-phase16 = { path = "../phase16", version = "=0.2.2" }
serde_json = "1.0.150"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
